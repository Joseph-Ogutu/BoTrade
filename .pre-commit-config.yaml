repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: secret-scan
        name: secret scan (history and tree)
        entry: python scripts/scan_history.py --strict
        language: system
        pass_filenames: false
        always_run: true
