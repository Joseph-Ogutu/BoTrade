[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# The database URL is read from the DATABASE_URL environment variable in migrations/env.py. Never put it here.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
