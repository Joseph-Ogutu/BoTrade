# LOCAL DEVELOPMENT ONLY: Postgres and Redis for tests. Not for deployment.
# Bound to 127.0.0.1 on unusual ports so it cannot clash with other projects on the machine.
# The database password is a throwaway generated by scripts/dev_up.sh into dev-local/ (git-ignored) and passed as a
# compose secret, so no password appears in this file or in git.
name: derivbot-dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: derivbot-dev-postgres
    restart: "no"
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: derivbot
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      TZ: UTC
    secrets: [pg_password]
    ports:
      - "127.0.0.1:55432:5432"
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    tmpfs:
      - /var/lib/postgresql/data   # throwaway: tests never need persistence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d derivbot"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: derivbot-dev-redis
    restart: "no"
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
secrets:
  pg_password:
    file: ./dev-local/postgres.password
