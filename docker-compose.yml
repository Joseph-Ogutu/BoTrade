# Full stack: postgres, redis, migrate (one shot), collector, bot. DEMO ONLY. Nothing here deploys itself.
#
# Hard-coded on purpose, not read from any env file: TRADING_MODE=demo, ALLOW_REAL_TRADING=false. Real trading is also
# locked in code (REAL_TRADING_IMPLEMENTED=False) and by a database CHECK, so editing this file cannot enable it.
# Secrets are files under ./secrets (git-ignored), created by scripts/init_secrets.sh, mounted at /run/secrets.
# Only the bot publishes a port, and only on the HOST loopback (127.0.0.1:8787, admin API and dashboard, bearer token).
name: derivbot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: derivbot-postgres
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: derivbot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: UTC
    secrets: [postgres_password]
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC", "-c", "listen_addresses=*"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /run/postgresql
    # postgres needs CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER to start from the root-owned entrypoint, then drops to uid 70
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    networks: [backend]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d derivbot"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    <<: *hardening
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: derivbot-redis
    secrets: [redis_password]
    # Run as the image's redis user (uid 999, gid 1000) from the start. Our command goes through sh -c, so the image's
    # entrypoint would never drop root, and root without capabilities cannot write to the redis-owned /data volume.
    user: "999:1000"
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes --dir /data"]
    volumes:
      - redisdata:/data
    networks: [backend]
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One-shot: applies migrations, then exits 0. The bot refuses to start unless the schema is at the alembic head.
  migrate:
    <<: *hardening
    restart: "no"
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: derivbot-bot:local
    container_name: derivbot-migrate
    command: ["alembic", "upgrade", "head"]
    environment: &db_env
      POSTGRES_HOST: postgres
      POSTGRES_USER: bot
      POSTGRES_DB: derivbot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    tmpfs: [/tmp]
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}

  bot:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: derivbot-bot:local
    container_name: derivbot-bot
    command: ["python", "-m", "derivbot.app"]
    environment:
      <<: *db_env
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      TRADING_MODE: demo
      ALLOW_REAL_TRADING: "false"
      DERIV_PAT_DEMO_FILE: /run/secrets/deriv_pat_demo
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      ADMIN_API_TOKEN_FILE: /run/secrets/admin_api_token
      DASHBOARD_PASSWORD_HASH_FILE: /run/secrets/dashboard_password_hash   # read at each login; empty means no password set
      DERIV_APP_ID_DEMO: ${DERIV_APP_ID_DEMO:-}
      DERIV_ACCOUNT_ID_DEMO: ${DERIV_ACCOUNT_ID_DEMO:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KILL_SWITCH_PATH: /state/KILL_SWITCH
      ADMIN_API_BIND: container
      TZ: UTC
    secrets: [postgres_password, redis_password, deriv_pat_demo, telegram_bot_token, admin_api_token, dashboard_password_hash]
    volumes:
      - botstate:/state          # kill flag file: survives container recreation
    tmpfs: [/tmp]
    # The admin API and dashboard listen on all interfaces INSIDE the container (ADMIN_API_BIND) and are published on the
    # HOST's loopback only. Reach them with an SSH tunnel: ssh -L 8787:127.0.0.1:8787 deploy@<host>, then open /ui.
    ports:
      - "127.0.0.1:8787:8787"
    networks: [backend, egress]
    mem_limit: 512m
    pids_limit: 200
    stop_grace_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "derivbot.healthcheck_bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional public HTTPS front for the dashboard (profile "public": COMPOSE_PROFILES=public). Not started by default.
  # The ONLY service that publishes ports 80 and 443. It reaches the bot over the internal compose network.
  caddy:
    <<: *hardening
    profiles: ["public"]
    image: caddy:2-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    container_name: derivbot-caddy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST:-localhost}
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    tmpfs: [/tmp]
    networks: [egress]
    mem_limit: 64m
    pids_limit: 100
    depends_on:
      bot: {condition: service_healthy}

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
      args:
        APP_UID: ${APP_UID:-1000}   # must match the owner of ./data on the host
    image: derivbot-collector:local
    container_name: derivbot-collector
    restart: unless-stopped
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Fails if the heartbeat file is stale or a required (always open) symbol has not ticked in
      # health_max_age_s seconds (config/collector.json). Closed-market symbols are not counted.
      test: ["CMD", "python", "-m", "derivbot.collector.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  backend:
    internal: true        # postgres and redis have no route to the internet
  egress: {}              # the bot (Deriv, Telegram) only

volumes:
  pgdata:
  redisdata:
  botstate:
  caddydata:
  caddyconfig:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  deriv_pat_demo:
    file: ./secrets/deriv_pat_demo
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  admin_api_token:
    file: ./secrets/admin_api_token
  dashboard_password_hash:
    file: ./secrets/dashboard_password_hash
